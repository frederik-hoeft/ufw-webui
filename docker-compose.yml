# Development-only PostgreSQL helper. Production deployment lives in deploy/docker/compose.yml.
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ufw_webui
      POSTGRES_USER: ufw_webui
      POSTGRES_PASSWORD: ufw_webui
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufw_webui -d ufw_webui"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
