services:
  web:
    image: ${UFW_WEB_IMAGE:-ufw-webui:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    group_add:
      # Rootless Docker: container GID 0 maps to the rootless Docker user's
      # primary host GID. Rootful Docker: set this to the daemon IPC group's
      # numeric host GID instead.
      - "${UFW_IPC_CONTAINER_GID:-0}"
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DetailedErrors: "false"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ufw_webui};Username=${POSTGRES_USER:-ufw_webui};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Auth__Jwt__Issuer: "${UFW_JWT_ISSUER:-ufw-webui}"
      Auth__Jwt__Audience: "${UFW_JWT_AUDIENCE:-ufw-webui-client}"
      Auth__Jwt__SigningKeyPath: "/run/secrets/ufw-web-jwt.pem"
      Auth__Bootstrap__Users__0__Email: "${UFW_BOOTSTRAP_EMAIL:?set UFW_BOOTSTRAP_EMAIL in .env}"
      Auth__Bootstrap__Users__0__UserName: "${UFW_BOOTSTRAP_USERNAME:-admin}"
      Auth__Bootstrap__Users__0__Password: "${UFW_BOOTSTRAP_PASSWORD:-}"
      Auth__Bootstrap__Users__0__EmailConfirmed: "true"
      IpcOptions__Endpoint: "/run/ufw-manager/ufw-systemd.sock"
      IpcOptions__TlsEnabled: "false"
      IpcOptions__RequestTimeout: "00:00:30"
      Logging__Console__FormatterName: "json"
    ports:
      # Keep Kestrel private to the host. Terminate browser HTTPS at a reverse
      # proxy and forward to this loopback listener.
      - "127.0.0.1:${UFW_WEB_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${UFW_IPC_HOST_DIR:-/run/ufw-manager}
        target: /run/ufw-manager
        read_only: true
      - type: bind
        source: ${UFW_WEB_JWT_KEY_PATH:?set UFW_WEB_JWT_KEY_PATH in .env}
        target: /run/secrets/ufw-web-jwt.pem
        read_only: true
      - type: volume
        source: web-state
        target: /var/lib/ufw-webui
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    # Use the official image lifecycle: its entrypoint may perform storage setup
    # as container root, then execs the PostgreSQL server as the unprivileged
    # `postgres` account. Do not override the image user.
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ufw_webui}"
      POSTGRES_USER: "${POSTGRES_USER:-ufw_webui}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - "${POSTGRES_DATA_SOURCE:-postgres-data}:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-ufw_webui}\" -d \"${POSTGRES_DB:-ufw_webui}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  web-state:
