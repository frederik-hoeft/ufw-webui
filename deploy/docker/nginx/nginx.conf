worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# The runtime container is deliberately non-root and read-only. All nginx
# writable runtime paths therefore live on the Compose-provided /tmp tmpfs.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 2m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip_static on;

    # ASP exposes no TCP listener. nginx reaches Kestrel only through the
    # group-restricted Unix socket in the shared read-only socket volume.
    upstream ufw_asp {
        server unix:/run/ufw-web-api/socket/asp.sock;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/security-headers.conf;

        # The only path nginx forwards into the ASP trust domain. Static files,
        # SPA fallback, and browser boot configuration can never be supplied by
        # a compromised ASP process.
        location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Port $server_port;
            # ASP also enables HSTS in Production. Keep the browser-facing
            # policy single-sourced at nginx rather than emitting duplicates.
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://ufw_asp;
        }

        # Browser boot/config files should be revalidated on every navigation so
        # an update cannot leave an old entrypoint pointing at a mixed asset set.
        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location = /appsettings.json {
            expires -1;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Do not turn nginx into a generic reverse proxy if another endpoint is
        # added to ASP in the future. Only /api/* above crosses the boundary.
        location = /health {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
