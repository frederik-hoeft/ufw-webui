<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="brand/ufw-console-app-icon.svg" />
    <title>UFW Console</title>
</head>
<body>
    <div id="app">
        <main class="bootstrap-shell">
            <div class="bootstrap-status" role="status" aria-live="polite">
                <img class="bootstrap-brand-mark" src="brand/ufw-console-app-icon.svg" alt="" aria-hidden="true" />
                <span class="bootstrap-status-copy">
                    <span class="bootstrap-status-title">UFW Console</span>
                    <span id="bootstrap-status-detail" class="bootstrap-status-detail">Loading application...</span>
                </span>
            </div>
        </main>
    </div>
    <div id="blazor-error-ui" data-nosnippet>
        <span id="blazor-error-message">An unexpected error occurred.</span>
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">&#x2715;</button>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/startup.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
