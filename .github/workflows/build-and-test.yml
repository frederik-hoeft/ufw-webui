name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore src/Ufw.slnx
      - name: Build
        run: dotnet build src/Ufw.slnx --configuration Release --no-restore /p:TreatWarningsAsErrors=true
      - name: Test
        run: dotnet test src/Ufw.slnx --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed"
